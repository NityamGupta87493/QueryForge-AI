[tool.poetry]
name = "sql-sidekick"
version = "0.2.4"
description = "AI-powered SQL assistant"
authors = []
packages = [{include = "sidekick"}]

[tool.poetry.dependencies]
python = ">=3.8.1,<3.11"

pandas = "^1.3.3"
numpy = "^1.21.2"
click = "^8.0.1"
sqlalchemy = "^2.0.25"
psycopg2-binary = "^2.9.6"
colorama = "^0.4.6"
llama_index = "^0.9.0"
loguru = "^0.7.0"
toml = "^0.10.2"
sqlglot = "^12.2.0"
sqlparse = "^0.4.4"
transformers = "^4.29.0"
sentence-transformers = "^2.2.2"
torch = "2.0.1"
sqlalchemy-utils = "^0.41.1"
h2o-wave = "0.26.3"
pandasql = "0.7.3"
accelerate = "0.21.0"
bitsandbytes = "0.41.0"
InstructorEmbedding = "^1.0.1"
h2ogpte = "1.3.9"
openai = "^1.3.0"
langchain-community = "^0.0.13"
python-dotenv = "^1.0.0"
databricks-sql-connector = "^3.0.1"

[tool.poetry.scripts]
sql-sidekick = "sidekick.prompter:cli"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
